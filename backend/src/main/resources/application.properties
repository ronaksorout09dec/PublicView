# =========================================================
# Prop-OS — Ultimate Property Operating System
# Phase 2 — Application Configuration
# =========================================================

# Server
server.port=8080
server.servlet.context-path=/
spring.application.name=prop-os

# =========================================================
# Database — PostgreSQL (prod) with H2 fallback (dev)
# =========================================================
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:realestate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# =========================================================
# Flyway — Migration (Phase 2+)
# For H2 dev: enabled=false, for Postgres prod: enabled=true via env FLYWAY_ENABLED
# =========================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# =========================================================
# JWT — Security
# =========================================================
# Generate strong Base64 secret: openssl rand -base64 64
# Default is Base64 of 64-char secure string for dev only
app.jwt.secret=${JWT_SECRET:U2VjcmV0S2V5Rm9yUHJvcE9TU3VwZXJTZWN1cmVNb25vbGl0aHlCdWlsZGluZ1NlY3JldEtleVRoYXRJc1ZlcnlMb25nQW5kU2VjdXJlMTIzNDU2Nzg5MDEyMw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXP_MS:604800000}

# =========================================================
# Redis — Caching, Pub/Sub, AccessPin TTL
# =========================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=2

# Cache
spring.cache.type=${CACHE_TYPE:simple}
# For prod with Redis: CACHE_TYPE=redis

# =========================================================
# AWS S3 — Document Storage (KYC, Lease PDFs, Ticket Media, Invoices)
# =========================================================
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:propos-documents-dev}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
# Path style: {org_id}/{entity}/{year}/{uuid}-{filename}

# =========================================================
# Ollama + Qwen3 — Legacy Voice Agent (still supported)
# =========================================================
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:latest}
ollama.timeout=${OLLAMA_TIMEOUT:60000}
ollama.temperature=${OLLAMA_TEMPERATURE:0.7}
ollama.max-tokens=${OLLAMA_MAX_TOKENS:500}

project.name=Prop-OS Ultimate Property Operating System
project.version=1.0.0-Phase2

# =========================================================
# Logging
# =========================================================
logging.level.root=INFO
logging.level.com.skyheights.realestate=DEBUG
logging.level.com.skyheights.realestate.security=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always

# =========================================================
# CORS — enterprise preview hosts allowed
# =========================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.e2b.app}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
# Note: SecurityConfig also has CorsConfigurationSource with allowedOriginPatterns *

# =========================================================
# Voice (legacy)
# =========================================================
voice.stt.provider=${VOICE_STT_PROVIDER:whisper}
voice.tts.provider=${VOICE_TTS_PROVIDER:kokoro}
voice.tts.fallback=${VOICE_TTS_FALLBACK:piper}

# =========================================================
# Prop-OS Specific
# =========================================================
app.default-org-slug=demo-estates
app.super-admin-email=superadmin@propos.io
