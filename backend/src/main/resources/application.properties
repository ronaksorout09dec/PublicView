# Server
server.port=8080
server.servlet.context-path=/

# Application
spring.application.name=real-estate-voice-agent

# Database - PostgreSQL (production) with H2 fallback for local dev
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:realestate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Ollama Configuration (MANDATORY - Qwen3 via Ollama)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:latest}
ollama.timeout=${OLLAMA_TIMEOUT:60000}
ollama.temperature=${OLLAMA_TEMPERATURE:0.7}
ollama.max-tokens=${OLLAMA_MAX_TOKENS:500}

# Project Information Cache
project.name=Sky Heights Residency
project.location=Sector 150 Noida
project.possession=December 2028

# Logging
logging.level.root=INFO
logging.level.com.skyheights.realestate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS - will be configured via WebConfig as well
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*

# Voice
voice.stt.provider=${VOICE_STT_PROVIDER:whisper}
voice.tts.provider=${VOICE_TTS_PROVIDER:kokoro}
voice.tts.fallback=${VOICE_TTS_FALLBACK:piper}
