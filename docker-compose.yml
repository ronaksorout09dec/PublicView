version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: propos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: propos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: propos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: propos-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propos-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/propos
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      DDL_AUTO: update
      FLYWAY_ENABLED: false
      JWT_SECRET: ${JWT_SECRET:-U2VjcmV0S2V5Rm9yUHJvcE9TU3VwZXJTZWN1cmVNb25vbGl0aHlCdWlsZGluZ1NlY3JldEtleVRoYXRJc1ZlcnlMb25nQW5kU2VjdXJlMTIzNDU2Nzg5MDEyMw==}
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXP_MS: 604800000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      AWS_S3_ENABLED: false
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: propos-documents-dev
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:latest
      OLLAMA_TIMEOUT: 60000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,https://*.vercel.app,https://*.e2b.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propos-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  ollama_data:
